version: 2

updates:
  # ---------------------------------------------------------------------------
  # Go modules
  # ---------------------------------------------------------------------------
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    reviewers:
      - maintainers
    labels:
      - dependencies
      - go
    commit-message:
      prefix: "chore(deps)"
    groups:
      go-dependencies:
        patterns:
          - "*"
    ignore:
      - dependency-name: "github.com/hashicorp/terraform-plugin-framework"
        update-types: ["version-update:semver-major"]

  # ---------------------------------------------------------------------------
  # GitHub Actions
  # ---------------------------------------------------------------------------
    # zizmor dependabot-cooldown: the implicit default is 3 days and the audit
    # requires 7. Security updates are exempt from cooldown, so this delays
    # feature bumps and not fixes.
    cooldown:
      default-days: 7
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: UTC
    reviewers:
      - maintainers
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: "chore(ci)"
    groups:
      github-actions-dependencies:
        patterns:
          - "*"
    # zizmor dependabot-cooldown: the implicit default is 3 days and the audit
    # requires 7. Security updates are exempt from cooldown, so this delays
    # feature bumps and not fixes.
    cooldown:
      default-days: 7
