name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {} # allows release.yml and weekly-security.yml to call this

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # hardening-exception: egress-audit — this job downloads Go modules and tools
      #   from the module proxy and clones this repository; harden-runner has never
      #   run in this repository, so no endpoint baseline exists and a block policy
      #   written without one fails closed on its first run; audit is what produces
      #   that list
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check go mod tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "go.mod or go.sum is out of date — run 'go mod tidy' and commit the result"
            exit 1
          fi
      - run: go build -v ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # hardening-exception: egress-audit — this job downloads Go modules and tools
      #   from the module proxy and clones this repository; harden-runner has never
      #   run in this repository, so no endpoint baseline exists and a block policy
      #   written without one fails closed on its first run; audit is what produces
      #   that list
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.3

  # Verifies docs/ matches what the pinned tfplugindocs (go.mod, run through
  # main.go's go:generate) renders from the schema descriptions, templates/
  # and examples/. Without it, six resources and fourteen data sources shipped
  # with no page on the public registry and fifteen pages drifted from their
  # schemas. `git status --porcelain` is used rather than `git diff` so a page
  # for a newly registered resource or data source (an untracked file) fails
  # the gate too.
  docs-drift:
    name: Generated Docs Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # hardening-exception: egress-audit — this job downloads Go modules and tools
      #   from the module proxy and clones this repository; harden-runner has never
      #   run in this repository, so no endpoint baseline exists and a block policy
      #   written without one fails closed on its first run; audit is what produces
      #   that list
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # tfplugindocs needs a terraform binary to read the provider schema.
      # Pre-installing it keeps tfplugindocs from downloading and GPG-verifying
      # one through hc-install, the same transient failure the acceptance
      # shards avoid.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false
      - name: Regenerate docs
        run: make docs
      - name: Fail on drift
        run: |
          if [ -n "$(git status --porcelain -- docs/)" ]; then
            git status --porcelain -- docs/
            git diff -- docs/
            echo "::error::docs/ is out of sync with the provider schema, templates/ or examples/."
            echo "Run 'make docs' locally and commit the result."
            exit 1
          fi
          echo "Generated docs are in sync."

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # hardening-exception: egress-audit — this job downloads Go modules and tools
      #   from the module proxy and clones this repository; harden-runner has never
      #   run in this repository, so no endpoint baseline exists and a block policy
      #   written without one fails closed on its first run; audit is what produces
      #   that list
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      # ./internal/cigate holds no product code. It asserts a relationship
      # between two jobs in weekly-security.yml that is otherwise joined only
      # by a comment; see internal/cigate/osv_reachability_test.go.
      #
      # ./internal/provider is mostly acceptance tests, which skip themselves
      # without TF_ACC, and the acceptance shards below select tests by exact
      # name, so its unit tests (resource methods driven against an httptest
      # backend, semver) ran nowhere until they were listed here.
      - run: go test -v -count=1 -timeout 10m ./internal/client/... ./internal/cigate/... ./internal/provider/...

  # Acceptance tests need a running backend, and this repository no longer
  # carries a pinned public image to pull one from (see docker-compose.test.yml
  # and README.md "Running tests"). This job only runs when the repository (or
  # an environment protecting it) has a TFR_ACC_BACKEND_IMAGE secret naming an
  # image it can reach; on a fork, or any checkout without that secret
  # configured, it is skipped rather than failed. Acceptance tests otherwise
  # run wherever a backend is reachable and that secret is set — see
  # README.md for the full environment-variable contract, which applies the
  # same way in any CI environment.
  #
  # Acceptance tests are sharded across 4 parallel jobs to cut wall-clock time.
  # Each shard runs its own isolated Docker stack on a fresh runner — no shared
  # state between shards. Partition is by test-name regex, balanced by observed
  # runtime so each shard finishes in roughly equal time (~10–12 min).
  acc-tests-matrix:
    name: Acceptance Tests / ${{ matrix.shard.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ secrets.TFR_ACC_BACKEND_IMAGE != '' }}
    strategy:
      fail-fast: false
      matrix:
        shard:
          # Heavy resource tests (creation-intensive). ~600s.
          - id: shard-1
            run: "^(TestAccModuleSCMLink_basic|TestAccOrganizationMember_basic|TestAccPolicy_basic)$"
          # Mid-heavy resource tests. ~600s.
          - id: shard-2
            run: "^(TestAccModule_basic|TestAccProviderRecord_basic|TestAccTerraformMirror_basic|TestAccMirror_basic|TestAccMirror_noOrganizationID_refused|TestAccUser_basic)$"
          # Mixed mediums. ~720s.
          - id: shard-3
            run: "^(TestAccAPIKey_basic|TestAccApprovalRequest_basic|TestAccOrganization_basic|TestAccRoleTemplate_basic|TestAccDataProviders_basic|TestAccSCMProvider_basic|TestAccStorageConfig_basic)$"
          # Data-source tests (lightweight, mostly 60s each). ~600s.
          - id: shard-4
            run: "^(TestAccDataAPIKeys_basic|TestAccDataAuditLogs_basic|TestAccDataMirrors_basic|TestAccDataModules_basic|TestAccDataOrganizations_basic|TestAccDataRoleTemplates_basic|TestAccDataSCMProviders_basic|TestAccDataStats_basic|TestAccDataTerraformMirrors_basic|TestAccDataUsers_basic)$"
    steps:
      # hardening-exception: egress-audit — this job pulls base images and pushes
      #   layers to a container registry, downloads Go modules and tools from the
      #   module proxy, and calls the GitHub API; harden-runner has never run in this
      #   repository, so no endpoint baseline exists and a block policy written
      #   without one fails closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Pre-install Terraform so terraform-plugin-testing finds it on PATH
      # instead of downloading and GPG-verifying it from releases.hashicorp.com.
      # Avoids transient hc-install signature failures.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      # Only runs when the backend image itself is private: a registry that
      # needs no authentication to pull from needs no login step, so this is
      # skipped whenever TFR_ACC_REGISTRY_PASSWORD is unset rather than
      # assuming any one registry host.
      - name: Log in to the backend image registry
        if: ${{ secrets.TFR_ACC_REGISTRY_PASSWORD != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ secrets.TFR_ACC_REGISTRY_HOST }}
          username: ${{ secrets.TFR_ACC_REGISTRY_USERNAME }}
          password: ${{ secrets.TFR_ACC_REGISTRY_PASSWORD }}

      - name: Start test stack
        env:
          TFR_ACC_BACKEND_IMAGE: ${{ secrets.TFR_ACC_BACKEND_IMAGE }}
        run: docker compose -f deployments/docker-compose.test.yml up -d

      - name: Wait for backend to be healthy
        run: |
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/health > /dev/null; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "  attempt $i/30 — retrying in 3s"
            sleep 3
          done
          echo "Backend did not become healthy in time"
          docker compose -f deployments/docker-compose.test.yml logs backend
          exit 1

      - name: Run acceptance tests (${{ matrix.shard.id }})
        env:
          TF_ACC: "1"
          TF_REGISTRY_ENDPOINT: "http://localhost:8081"
          # Read by provider_test.go's TestMain: bootstraps a platform-admin
          # account through the backend's setup API using the one-time
          # setup token the backend wrote here (docker-compose.test.yml
          # binds this path into the backend container). No SQL seeding
          # and no direct database writes.
          TFR_ACC_SETUP_TOKEN_FILE: ${{ github.workspace }}/deployments/.acc-run/setup-token
        run: go test -v -count=1 -timeout 25m -run '${{ matrix.shard.run }}' ./internal/provider/...

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose -f deployments/docker-compose.test.yml logs backend

  # Aggregator job — keeps a single required check ("Acceptance Tests") for
  # branch protection so we don't have to update protection rules when shards
  # are added or rebalanced. Fails if any shard failed; a skip (no
  # TFR_ACC_BACKEND_IMAGE secret configured — see acc-tests-matrix) is not a
  # failure, since public CI cannot supply a backend on its own.
  acc-tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: acc-tests-matrix
    if: always()
    steps:
      # hardening-exception: egress-audit — runs only shell against the checkout, so
      #   its egress is already minimal, but harden-runner has never run in this
      #   repository, so no endpoint baseline exists and a block policy written
      #   without one fails closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Verify all shards succeeded (or were skipped together)
        run: |
          result="${{ needs.acc-tests-matrix.result }}"
          if [ "$result" = "success" ]; then
            echo "All acceptance-test shards passed."
            exit 0
          fi
          if [ "$result" = "skipped" ]; then
            echo "Acceptance tests skipped: no TFR_ACC_BACKEND_IMAGE secret is configured for this repository."
            echo "See README.md \"Running tests\" to run them locally or in a CI environment that has one."
            exit 0
          fi
          echo "One or more acceptance-test shards failed: $result"
          exit 1
