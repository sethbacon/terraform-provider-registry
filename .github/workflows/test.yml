name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch: {}
  workflow_call: {} # allows release.yml and weekly-security.yml to call this

concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # hardening-exception: egress-audit — this job downloads Go modules and tools
      #   from the module proxy and clones this repository; harden-runner has never
      #   run in this repository, so no endpoint baseline exists and a block policy
      #   written without one fails closed on its first run; audit is what produces
      #   that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Check go mod tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "go.mod or go.sum is out of date — run 'go mod tidy' and commit the result"
            exit 1
          fi
      - run: go build -v ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # hardening-exception: egress-audit — this job downloads Go modules and tools
      #   from the module proxy and clones this repository; harden-runner has never
      #   run in this repository, so no endpoint baseline exists and a block policy
      #   written without one fails closed on its first run; audit is what produces
      #   that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.11.3

  # Verifies the generated client types in internal/client/spec/models_gen.go
  # haven't drifted from what the pinned backend's openapi3.json would produce.
  # See internal/client/spec/README.md for the toolchain.
  models-gen-drift:
    name: Generated Models Drift
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # hardening-exception: egress-audit — this job pulls base images and pushes
      #   layers to a container registry, downloads Go modules and tools from the
      #   module proxy, and calls the GitHub API; harden-runner has never run in this
      #   repository, so no endpoint baseline exists and a block policy written
      #   without one fails closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install oapi-codegen
        uses: 4cloudguru/shared-workflows/.github/actions/go-install@9276df8e0bdb3152e2529ab98c8b99cfb9e22d4b # v1.13.0
        with:
          package: github.com/oapi-codegen/oapi-codegen/v2/cmd/oapi-codegen@v2.7.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Regenerate models
        run: make models-gen
      - name: Fail on drift
        run: |
          if ! git diff --exit-code internal/client/spec/openapi3.json internal/client/spec/openapi3-patched.json internal/client/spec/models_gen.go; then
            echo "::error::Generated client types are out of sync with the pinned backend's openapi3.json."
            echo "Run 'make models-gen' locally and commit the result."
            exit 1
          fi
          echo "Generated models are in sync with the pinned backend."

  unit-tests:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # hardening-exception: egress-audit — this job downloads Go modules and tools
      #   from the module proxy and clones this repository; harden-runner has never
      #   run in this repository, so no endpoint baseline exists and a block policy
      #   written without one fails closed on its first run; audit is what produces
      #   that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go test -v -count=1 -timeout 10m ./internal/client/...

  # Acceptance tests are sharded across 4 parallel jobs to cut wall-clock time.
  # Each shard runs its own isolated Docker stack on a fresh runner — no shared
  # state between shards. Partition is by test-name regex, balanced by observed
  # runtime so each shard finishes in roughly equal time (~10–12 min).
  acc-tests-matrix:
    name: Acceptance Tests / ${{ matrix.shard.id }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard:
          # Heavy resource tests (creation-intensive). ~600s.
          - id: shard-1
            run: "^(TestAccModuleSCMLink_basic|TestAccOrganizationMember_basic|TestAccPolicy_basic)$"
          # Mid-heavy resource tests. ~600s.
          - id: shard-2
            run: "^(TestAccModule_basic|TestAccProviderRecord_basic|TestAccTerraformMirror_basic|TestAccMirror_basic|TestAccUser_basic)$"
          # Mixed mediums. ~720s.
          - id: shard-3
            run: "^(TestAccAPIKey_basic|TestAccApprovalRequest_basic|TestAccOrganization_basic|TestAccRoleTemplate_basic|TestAccDataProviders_basic|TestAccSCMProvider_basic|TestAccStorageConfig_basic)$"
          # Data-source tests (lightweight, mostly 60s each). ~600s.
          - id: shard-4
            run: "^(TestAccDataAPIKeys_basic|TestAccDataAuditLogs_basic|TestAccDataMirrors_basic|TestAccDataModules_basic|TestAccDataOrganizations_basic|TestAccDataRoleTemplates_basic|TestAccDataSCMProviders_basic|TestAccDataStats_basic|TestAccDataTerraformMirrors_basic|TestAccDataUsers_basic)$"
    steps:
      # hardening-exception: egress-audit — this job pulls base images and pushes
      #   layers to a container registry, downloads Go modules and tools from the
      #   module proxy, and calls the GitHub API; harden-runner has never run in this
      #   repository, so no endpoint baseline exists and a block policy written
      #   without one fails closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Pre-install Terraform so terraform-plugin-testing finds it on PATH
      # instead of downloading and GPG-verifying it from releases.hashicorp.com.
      # Avoids transient hc-install signature failures.
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Start test stack
        run: docker compose -f deployments/docker-compose.test.yml up -d

      - name: Wait for backend to be healthy
        run: |
          echo "Waiting for backend..."
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8081/health > /dev/null; then
              echo "Backend is healthy"
              exit 0
            fi
            echo "  attempt $i/30 — retrying in 3s"
            sleep 3
          done
          echo "Backend did not become healthy in time"
          docker compose -f deployments/docker-compose.test.yml logs backend
          exit 1

      - name: Seed dev admin user
        run: |
          docker compose -f deployments/docker-compose.test.yml exec -T postgres \
            psql -U registry -d terraform_registry \
            < deployments/seed-dev-admin.sql

      - name: Run acceptance tests (${{ matrix.shard.id }})
        env:
          TF_ACC: "1"
          TF_REGISTRY_ENDPOINT: "http://localhost:8081"
        run: go test -v -count=1 -timeout 25m -run '${{ matrix.shard.run }}' ./internal/provider/...

      - name: Dump backend logs on failure
        if: failure()
        run: docker compose -f deployments/docker-compose.test.yml logs backend

  # Aggregator job — keeps a single required check ("Acceptance Tests") for
  # branch protection so we don't have to update protection rules when shards
  # are added or rebalanced. Fails if any shard failed or was skipped.
  acc-tests:
    name: Acceptance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: acc-tests-matrix
    if: always()
    steps:
      # hardening-exception: egress-audit — runs only shell against the checkout, so
      #   its egress is already minimal, but harden-runner has never run in this
      #   repository, so no endpoint baseline exists and a block policy written
      #   without one fails closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Verify all shards succeeded
        run: |
          if [ "${{ needs.acc-tests-matrix.result }}" != "success" ]; then
            echo "One or more acceptance-test shards failed: ${{ needs.acc-tests-matrix.result }}"
            exit 1
          fi
          echo "All acceptance-test shards passed."
