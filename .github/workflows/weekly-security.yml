name: Weekly Security Scan

on:
  schedule:
    - cron: "0 8 * * 1" # Every Monday 08:00 UTC
  workflow_dispatch: {}

jobs:
  ci:
    name: CI
    secrets: inherit
    uses: ./.github/workflows/test.yml

  # ── OSV Vulnerability Scan ────────────────────────────
  osv-scan:
    name: OSV Vulnerability Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Run OSV-Scanner
        id: osv
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        continue-on-error: true
        with:
          scan-args: |-
            --recursive
            .
            --format=json
            --output=osv-results.json

      # Files ONE tracking issue, identified by the `osv-report` label rather than
      # by title (the title carries a date). The issue body names the advisories, so
      # it can be triaged without opening a workflow log; it is rewritten in place
      # while findings persist and closed when a scan comes back clean.
      - name: Report OSV findings
        if: always() && steps.osv.outcome != 'skipped'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');

            const LABEL = 'osv-report';
            const today = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };

            let scan;
            try {
              scan = JSON.parse(fs.readFileSync('osv-results.json', 'utf8'));
            } catch (err) {
              core.setFailed(`Could not read osv-results.json (${err.message}). The scan step did not produce a report, so findings could not be triaged.`);
              return;
            }

            // osv-scanner runs Go call-graph analysis. A group whose every advisory is
            // marked `called: false` is not reachable from this codebase; the scanner
            // itself omits those from its table and from its exit code, so they are
            // reported here as context only and never open an issue on their own.
            const isReachable = (group) => {
              const analysis = group.experimental_analysis;
              if (!analysis) return true;
              return Object.values(analysis).some((a) => a.called && !a.unimportant);
            };

            const fixedVersions = (pkgName, vuln) => {
              const out = new Set();
              for (const affected of vuln?.affected ?? []) {
                if (affected.package?.name !== pkgName) continue;
                for (const range of affected.ranges ?? []) {
                  for (const event of range.events ?? []) {
                    if (event.fixed) out.add(event.fixed);
                  }
                }
              }
              return [...out].join(', ');
            };

            const reachable = [];
            const unreachable = [];
            for (const result of scan.results ?? []) {
              const source = result.source?.path ?? '';
              for (const pkg of result.packages ?? []) {
                const name = pkg.package?.name ?? '(unknown)';
                const version = pkg.package?.version ?? '(unknown)';
                const byId = new Map((pkg.vulnerabilities ?? []).map((v) => [v.id, v]));
                for (const group of pkg.groups ?? []) {
                  const id = (group.ids ?? [])[0];
                  if (!id) continue;
                  const vuln = byId.get(id);
                  const entry = {
                    id,
                    aliases: (group.aliases ?? []).filter((a) => a !== id),
                    severity: group.max_severity || '—',
                    pkg: name,
                    version,
                    fixed: fixedVersions(name, vuln) || '—',
                    summary: vuln?.summary ?? '',
                    source,
                  };
                  (isReachable(group) ? reachable : unreachable).push(entry);
                }
              }
            }

            const byPkgThenId = (a, b) => `${a.pkg}${a.id}`.localeCompare(`${b.pkg}${b.id}`);
            reachable.sort(byPkgThenId);
            unreachable.sort(byPkgThenId);

            // Stable across runs: changes only when the finding set itself changes,
            // so a persisting set updates the issue instead of opening another one.
            const fingerprint = crypto
              .createHash('sha256')
              .update(reachable.map((f) => `${f.id}@${f.pkg}@${f.version}`).join(';'))
              .digest('hex')
              .slice(0, 12);

            const { data: openIssues } = await github.rest.issues.listForRepo({
              ...repo,
              state: 'open',
              labels: LABEL,
              per_page: 100,
            });
            const existing = openIssues.find((i) => !i.pull_request);

            // ── Clean scan: resolve the tracking issue instead of leaving it open ──
            if (reachable.length === 0) {
              core.summary.addHeading('OSV-Scanner: clean', 2);
              core.summary.addRaw(`No reachable advisories. ${unreachable.length} unreachable finding(s) suppressed.`);
              await core.summary.write();

              if (!existing) {
                core.info('No reachable advisories and no open OSV issue. Nothing to do.');
                return;
              }
              await github.rest.issues.createComment({
                ...repo,
                issue_number: existing.number,
                body: [
                  `**Resolved — OSV-Scanner reported no reachable advisories on ${today}.**`,
                  '',
                  `Verified by [this run](${runUrl}) against \`${context.sha}\`.`,
                  unreachable.length
                    ? `\n${unreachable.length} advisory/advisories remain in the dependency tree but are not reachable from this codebase (call-graph analysis), so they are not tracked here.`
                    : '',
                  '',
                  'Closing automatically. A future scan with reachable findings will open a new tracking issue.',
                ].join('\n'),
              });
              await github.rest.issues.update({
                ...repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`Closed #${existing.number} — scan is clean.`);
              return;
            }

            // ── Findings present: build an issue body that names them ──
            const table = [
              '| Advisory | Severity | Package | Version | Fixed in |',
              '| --- | --- | --- | --- | --- |',
              ...reachable.map(
                (f) => `| [${f.id}](https://osv.dev/${f.id}) | ${f.severity} | \`${f.pkg}\` | \`${f.version}\` | \`${f.fixed}\` |`,
              ),
            ];

            const details = reachable
              .filter((f) => f.summary || f.aliases.length)
              .map((f) => {
                const alias = f.aliases.length ? ` _(aliases: ${f.aliases.join(', ')})_` : '';
                return `- **${f.id}** — ${f.summary || 'no summary published'}${alias}`;
              });

            const pkgCount = new Set(reachable.map((f) => f.pkg)).size;
            const body = [
              '## OSV-Scanner Vulnerability Report',
              '',
              `**${reachable.length} reachable advisory/advisories across ${pkgCount} package(s).**`,
              '',
              `- **Last confirmed:** ${today} ([run](${runUrl}), commit \`${context.sha.slice(0, 7)}\`)`,
              '',
              ...table,
              '',
              ...(details.length ? ['<details><summary>Advisory details</summary>', '', ...details, '', '</details>', ''] : []),
              ...(unreachable.length
                ? [
                    `<details><summary>${unreachable.length} advisory/advisories present but not reachable (call-graph analysis) — not counted above</summary>`,
                    '',
                    ...unreachable.map((f) => `- ${f.id} — \`${f.pkg}@${f.version}\` (fixed in \`${f.fixed}\`)`),
                    '',
                    '</details>',
                    '',
                  ]
                : []),
              'Update the affected dependencies to at least the listed fixed version. This issue is maintained automatically by the weekly scan: it is rewritten in place while these findings persist, and closed once a scan reports no reachable advisories.',
              '',
              `<!-- osv-fingerprint: ${fingerprint} -->`,
            ].join('\n');

            core.summary.addHeading(`OSV-Scanner: ${reachable.length} reachable advisory/advisories`, 2);
            core.summary.addRaw(table.join('\n'));
            await core.summary.write();

            const title = `OSV-Scanner: vulnerabilities found — ${today}`;

            if (!existing) {
              // The label is the dedupe key. If it does not exist yet, issues.create
              // drops it silently and the next run would open another issue instead of
              // finding this one, so make sure it exists before relying on it.
              try {
                await github.rest.issues.getLabel({ ...repo, name: LABEL });
              } catch (err) {
                if (err.status !== 404) throw err;
                await github.rest.issues.createLabel({
                  ...repo,
                  name: LABEL,
                  color: 'B60205',
                  description: 'Tracking issue maintained by the weekly OSV-Scanner job',
                });
                core.info(`Created missing '${LABEL}' label.`);
              }

              const { data: created } = await github.rest.issues.create({
                ...repo,
                title,
                body,
                labels: [LABEL, 'security', 'dependencies'],
              });
              core.info(`Opened #${created.number} with ${reachable.length} advisory/advisories.`);
              return;
            }

            const previous = (existing.body ?? '').match(/<!-- osv-fingerprint: ([0-9a-f]+) -->/);
            const unchanged = previous && previous[1] === fingerprint;

            await github.rest.issues.update({ ...repo, issue_number: existing.number, title, body });

            if (unchanged) {
              // Same finding set as last week — refresh the issue quietly rather than
              // opening a duplicate or adding a weekly comment nobody reads.
              core.info(`#${existing.number} refreshed; finding set unchanged (${fingerprint}).`);
              return;
            }

            // The set actually changed — that is the only event worth a notification.
            const previousIds = new Set(
              [...(existing.body ?? '').matchAll(/\[((?:GHSA|CVE|GO)-[0-9A-Za-z-]+)\]\(https:\/\/osv\.dev\//g)].map((m) => m[1]),
            );
            const currentIds = new Set(reachable.map((f) => f.id));
            const added = [...currentIds].filter((id) => !previousIds.has(id));
            const removed = [...previousIds].filter((id) => !currentIds.has(id));

            await github.rest.issues.createComment({
              ...repo,
              issue_number: existing.number,
              body: [
                `**Finding set changed as of ${today}** ([run](${runUrl})).`,
                '',
                added.length ? `- Newly reported: ${added.map((id) => `\`${id}\``).join(', ')}` : '',
                removed.length ? `- No longer reported: ${removed.map((id) => `\`${id}\``).join(', ')}` : '',
                '',
                'The issue body above has been updated to the current set.',
              ]
                .filter((line) => line !== '')
                .join('\n'),
            });
            core.info(`#${existing.number} updated: +${added.length} / -${removed.length}.`);

  # ── CodeQL Analysis ───────────────────────────────────
  codeql:
    name: CodeQL Analysis (Go)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4 # TODO: pin to SHA — see repo security policy
        with:
          languages: go

      - name: Build for CodeQL
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4 # TODO: pin to SHA — see repo security policy
        with:
          category: /language:go

  # ── Stale Dependabot PRs ──────────────────────────────
  stale-dependabot:
    name: Flag stale Dependabot PRs
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Label PRs open > 14 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --author "app/dependabot" \
            --state open \
            --json number,createdAt,title \
            --jq '.[] | select((.createdAt | fromdateiso8601) < (now - 1209600)) | .number' \
          | xargs -r -I{} gh pr edit {} \
              --repo "$GITHUB_REPOSITORY" \
              --add-label "stale-security-patch" || true

  # ── Notify on failure ─────────────────────────────────
  notify-on-failure:
    name: Create issue on failure
    runs-on: ubuntu-latest
    needs: [ci, osv-scan, codeql, stale-dependabot]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      - name: Create failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const title = `Scheduled build failed — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '## Scheduled Build Failure',
              '',
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'The weekly security scan failed. Please investigate and fix before the next release.',
              '',
              'Common causes:',
              '- A transitive Go dependency published a breaking change',
              '- An OSV vulnerability was found in go.sum',
              '- CodeQL detected a new code quality issue',
              '- A stale Dependabot PR requires manual review',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'ci'],
            });
