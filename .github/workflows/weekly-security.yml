name: Weekly Security Scan

on:
  schedule:
    - cron: "0 8 * * 1" # Every Monday 08:00 UTC
  workflow_dispatch: {}

jobs:
  ci:
    name: CI
    secrets: inherit
    uses: ./.github/workflows/test.yml

  # ── OSV Vulnerability Scan ────────────────────────────
  osv-scan:
    name: OSV Vulnerability Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      issues: write
    steps:
      # hardening-exception: egress-audit — this job queries the OSV vulnerability
      #   database, downloads the Go vulnerability database and the govulncheck tool,
      #   and calls the GitHub API; harden-runner has never run in this repository, so
      #   no endpoint baseline exists and a block policy written without one fails
      #   closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run OSV-Scanner
        id: osv
        # THE SHARED ACTION, NOT THE OFFICIAL ONE, AND NO continue-on-error (#894).
        #
        # `continue-on-error` was the defect: it collapsed exit 1 ("ran, found
        # something") and the error exits (127 general error, 128 no packages) into
        # one `outcome == 'failure'`, and it rewrote a failed step's `conclusion` to
        # `success`. A scanner that had stopped working produced exactly the same
        # green as one that ran and found nothing, in the run history and in the API
        # alike.
        #
        # The shared action reports the exit code it ACTUALLY got and exposes it as
        # `outputs.exit-code`, `outputs.findings` and `outputs.errored`, so the steps
        # below no longer have to infer the verdict from the artifact -- and a
        # scanner error fails the job immediately rather than passing for clean.
        uses: 4cloudguru/shared-workflows/.github/actions/osv-scan@adb01429f88e459fcc045598317b5d6c09f95647 # v1.26.1
        with:
          # --no-call-analysis=go is deliberate, and internal/cigate asserts it
          # stays paired with the govulncheck job below.
          #
          # The scanner image is built FROM a golang base, so it carries exactly
          # one Go toolchain, and the official golang images set
          # GOTOOLCHAIN=local — which forbids downloading or switching to
          # another. It therefore cannot build a module whose `go` directive
          # names a newer release, and ours is one.
          #
          # Measured 2026-08-27 at the pin above, v2.5.1, by pulling the image
          # and running the real scanner over a clean export of this repo:
          # the image reports go1.26.5, this module declares go 1.26.6, and the
          # internal govulncheck pass aborts with
          # "go.mod requires go >= 1.26.6 (running go 1.26.5; GOTOOLCHAIN=local)",
          # exit 127, results array empty. The same run with this flag exits 0.
          # A newer pin does not fix it: the image will always trail the
          # toolchain this module builds on.
          #
          # That abort was worse than useless: the pass produced no call graph, yet
          # every finding still defaulted to "reachable", so the tracking issue
          # asserted call-graph reachability that had never been computed.
          #
          # Reachability is now the `govulncheck` job's responsibility below — it
          # resolves its toolchain from go.mod, so it always matches the module.
          # This step does the flat known-vulnerability sweep of go.mod/go.sum,
          # which needs no toolchain at all.
          scan-args: |-
            --recursive
            .
            --no-call-analysis=go
            --format=json
            --output=osv-results.json

      # Files ONE tracking issue, identified by the `osv-report` label rather than
      # by title (the title carries a date). The issue body names the advisories, so
      # it can be triaged without opening a workflow log; it is rewritten in place
      # while findings persist and closed when a scan comes back clean.
      - name: Report OSV findings
        if: always() && steps.osv.outcome != 'skipped'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        env:
          # `outputs.errored`, not `outcome`: the scanner's own error exits are
          # now reported directly instead of being inferred from an empty report.
          OSV_ERRORED: ${{ steps.osv.outputs.errored }}
        with:
          script: |
            const fs = require('fs');
            const crypto = require('crypto');

            const LABEL = 'osv-report';
            const today = new Date().toISOString().slice(0, 10);
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const repo = { owner: context.repo.owner, repo: context.repo.repo };

            let scan;
            try {
              scan = JSON.parse(fs.readFileSync('osv-results.json', 'utf8'));
            } catch (err) {
              core.setFailed(`Could not read osv-results.json (${err.message}). The scan step did not produce a report, so findings could not be triaged.`);
              return;
            }

            // Go call analysis is disabled for this step (see the scan-args comment),
            // so these findings are "present in go.mod/go.sum", NOT "reachable". Do not
            // reintroduce reachability language here: with no call graph, `analysis` is
            // absent and everything falls through to true, which is exactly how this
            // job once asserted reachability it had never computed.
            const isCounted = (group) => {
              const analysis = group.experimental_analysis;
              if (!analysis) return true;
              return Object.values(analysis).some((a) => a.called && !a.unimportant);
            };

            const fixedVersions = (pkgName, vuln) => {
              const out = new Set();
              for (const affected of vuln?.affected ?? []) {
                if (affected.package?.name !== pkgName) continue;
                for (const range of affected.ranges ?? []) {
                  for (const event of range.events ?? []) {
                    if (event.fixed) out.add(event.fixed);
                  }
                }
              }
              return [...out].join(', ');
            };

            const counted = [];
            const notCounted = [];
            for (const result of scan.results ?? []) {
              const source = result.source?.path ?? '';
              for (const pkg of result.packages ?? []) {
                const name = pkg.package?.name ?? '(unknown)';
                const version = pkg.package?.version ?? '(unknown)';
                const byId = new Map((pkg.vulnerabilities ?? []).map((v) => [v.id, v]));
                for (const group of pkg.groups ?? []) {
                  const id = (group.ids ?? [])[0];
                  if (!id) continue;
                  const vuln = byId.get(id);
                  const entry = {
                    id,
                    aliases: (group.aliases ?? []).filter((a) => a !== id),
                    severity: group.max_severity || '—',
                    pkg: name,
                    version,
                    fixed: fixedVersions(name, vuln) || '—',
                    summary: vuln?.summary ?? '',
                    source,
                  };
                  (isCounted(group) ? counted : notCounted).push(entry);
                }
              }
            }

            const byPkgThenId = (a, b) => `${a.pkg}${a.id}`.localeCompare(`${b.pkg}${b.id}`);
            counted.sort(byPkgThenId);
            notCounted.sort(byPkgThenId);

            // ── Tell "vulnerabilities found" apart from "the scanner broke" ──
            // This used to be inferred: `continue-on-error` collapsed exit 1
            // ("found something") and the error exits into one outcome, GitHub
            // exposed the raw exit code nowhere, so the only tell left was that a
            // genuine exit 1 always carries at least one finding. The shared scan
            // action reports the exit code it actually got, so the inference is
            // gone and the scanner's own verdict is read directly (#894).
            const totalFindings = counted.length + notCounted.length;
            if (process.env.OSV_ERRORED === 'true') {
              core.setFailed(
                'OSV-Scanner exited non-zero but reported no findings at all. That is a scanner ' +
                  'error (exit 127 or similar), not a clean dependency tree, so this run is not ' +
                  'being reported as clean and the tracking issue is left as-is. See the scan step log.',
              );
              return;
            }

            // Stable across runs: changes only when the finding set itself changes,
            // so a persisting set updates the issue instead of opening another one.
            const fingerprint = crypto
              .createHash('sha256')
              .update(counted.map((f) => `${f.id}@${f.pkg}@${f.version}`).join(';'))
              .digest('hex')
              .slice(0, 12);

            const { data: openIssues } = await github.rest.issues.listForRepo({
              ...repo,
              state: 'open',
              labels: LABEL,
              per_page: 100,
            });
            const existing = openIssues.find((i) => !i.pull_request);

            // ── Clean scan: resolve the tracking issue instead of leaving it open ──
            if (counted.length === 0) {
              core.summary.addHeading('OSV-Scanner: clean', 2);
              core.summary.addRaw(`No advisories in go.mod/go.sum. ${notCounted.length} finding(s) filtered by the scanner.`);
              await core.summary.write();

              if (!existing) {
                core.info('No advisories reported and no open OSV issue. Nothing to do.');
                return;
              }
              await github.rest.issues.createComment({
                ...repo,
                issue_number: existing.number,
                body: [
                  `**Resolved — OSV-Scanner reported no known vulnerabilities in \`go.mod\`/\`go.sum\` on ${today}.**`,
                  '',
                  `Verified by [this run](${runUrl}) against \`${context.sha}\`.`,
                  notCounted.length
                    ? `\n${notCounted.length} advisory/advisories were filtered out by the scanner (suppressed in \`osv-scanner.toml\` or marked unimportant), so they are not tracked here.`
                    : '',
                  '',
                  'Closing automatically. A future scan with findings will open a new tracking issue.',
                ].join('\n'),
              });
              await github.rest.issues.update({
                ...repo,
                issue_number: existing.number,
                state: 'closed',
                state_reason: 'completed',
              });
              core.info(`Closed #${existing.number} — scan is clean.`);
              return;
            }

            // ── Findings present: build an issue body that names them ──
            const table = [
              '| Advisory | Severity | Package | Version | Fixed in |',
              '| --- | --- | --- | --- | --- |',
              ...counted.map(
                (f) => `| [${f.id}](https://osv.dev/${f.id}) | ${f.severity} | \`${f.pkg}\` | \`${f.version}\` | \`${f.fixed}\` |`,
              ),
            ];

            const details = counted
              .filter((f) => f.summary || f.aliases.length)
              .map((f) => {
                const alias = f.aliases.length ? ` _(aliases: ${f.aliases.join(', ')})_` : '';
                return `- **${f.id}** — ${f.summary || 'no summary published'}${alias}`;
              });

            const pkgCount = new Set(counted.map((f) => f.pkg)).size;
            const body = [
              '## OSV-Scanner Vulnerability Report',
              '',
              `**${counted.length} known advisory/advisories across ${pkgCount} package(s) in \`go.mod\`/\`go.sum\`.**`,
              '',
              'These are advisories against modules this repo requires. This job does *not* compute reachability — the `govulncheck` job in the same workflow does, and its log says which findings are reachable by call graph (symbol results), merely imported (package results), or only present in the module graph (module results). Check there before deciding urgency.',
              '',
              `- **Last confirmed:** ${today} ([run](${runUrl}), commit \`${context.sha.slice(0, 7)}\`)`,
              '',
              ...table,
              '',
              ...(details.length ? ['<details><summary>Advisory details</summary>', '', ...details, '', '</details>', ''] : []),
              ...(notCounted.length
                ? [
                    `<details><summary>${notCounted.length} advisory/advisories filtered out by the scanner — not counted above</summary>`,
                    '',
                    ...notCounted.map((f) => `- ${f.id} — \`${f.pkg}@${f.version}\` (fixed in \`${f.fixed}\`)`),
                    '',
                    '</details>',
                    '',
                  ]
                : []),
              'Update the affected dependencies to at least the listed fixed version. Where an advisory has no fixed version and is genuinely not reachable, suppress it by ID in `osv-scanner.toml` with the reasoning written down. This issue is maintained automatically by the weekly scan: it is rewritten in place while these findings persist, and closed once a scan comes back clean.',
              '',
              `<!-- osv-fingerprint: ${fingerprint} -->`,
            ].join('\n');

            core.summary.addHeading(`OSV-Scanner: ${counted.length} known advisory/advisories`, 2);
            core.summary.addRaw(table.join('\n'));
            await core.summary.write();

            const title = `OSV-Scanner: vulnerabilities found — ${today}`;

            if (!existing) {
              // The label is the dedupe key. If it does not exist yet, issues.create
              // drops it silently and the next run would open another issue instead of
              // finding this one, so make sure it exists before relying on it.
              try {
                await github.rest.issues.getLabel({ ...repo, name: LABEL });
              } catch (err) {
                if (err.status !== 404) throw err;
                await github.rest.issues.createLabel({
                  ...repo,
                  name: LABEL,
                  color: 'B60205',
                  description: 'Tracking issue maintained by the weekly OSV-Scanner job',
                });
                core.info(`Created missing '${LABEL}' label.`);
              }

              const { data: created } = await github.rest.issues.create({
                ...repo,
                title,
                body,
                labels: [LABEL, 'security', 'dependencies'],
              });
              core.info(`Opened #${created.number} with ${counted.length} advisory/advisories.`);
              return;
            }

            const previous = (existing.body ?? '').match(/<!-- osv-fingerprint: ([0-9a-f]+) -->/);
            const unchanged = previous && previous[1] === fingerprint;

            await github.rest.issues.update({ ...repo, issue_number: existing.number, title, body });

            if (unchanged) {
              // Same finding set as last week — refresh the issue quietly rather than
              // opening a duplicate or adding a weekly comment nobody reads.
              core.info(`#${existing.number} refreshed; finding set unchanged (${fingerprint}).`);
              return;
            }

            // The set actually changed — that is the only event worth a notification.
            const previousIds = new Set(
              [...(existing.body ?? '').matchAll(/\[((?:GHSA|CVE|GO)-[0-9A-Za-z-]+)\]\(https:\/\/osv\.dev\//g)].map((m) => m[1]),
            );
            const currentIds = new Set(counted.map((f) => f.id));
            const added = [...currentIds].filter((id) => !previousIds.has(id));
            const removed = [...previousIds].filter((id) => !currentIds.has(id));

            await github.rest.issues.createComment({
              ...repo,
              issue_number: existing.number,
              body: [
                `**Finding set changed as of ${today}** ([run](${runUrl})).`,
                '',
                added.length ? `- Newly reported: ${added.map((id) => `\`${id}\``).join(', ')}` : '',
                removed.length ? `- No longer reported: ${removed.map((id) => `\`${id}\``).join(', ')}` : '',
                '',
                'The issue body above has been updated to the current set.',
              ]
                .filter((line) => line !== '')
                .join('\n'),
            });
            core.info(`#${existing.number} updated: +${added.length} / -${removed.length}.`);

  # ── Reachability analysis ─────────────────────────────
  # The OSV job above answers "is a vulnerable module required?"; this one answers
  # "does our code actually reach it?", which is what decides urgency. It exists as
  # a separate job on purpose: setup-go resolves the toolchain from go.mod, so it
  # always matches the module and can build the call graph — unlike the pinned
  # osv-scanner container, whose bundled Go runs with GOTOOLCHAIN=local and cannot.
  #
  # Read the log by section. `=== Symbol Results ===` are reachable by call graph
  # and are the ones to act on. `=== Package Results ===` are imported but not
  # called. `=== Module Results ===` are only present in the module graph. Only
  # symbol results set a non-zero exit, so only they fail this job.
  govulncheck:
    name: govulncheck (reachability)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # hardening-exception: egress-audit — this job downloads the Go vulnerability
      #   database and the govulncheck tool, downloads Go modules and tools from the
      #   module proxy, and clones this repository; harden-runner has never run in
      #   this repository, so no endpoint baseline exists and a block policy written
      #   without one fails closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Install govulncheck
        uses: 4cloudguru/shared-workflows/.github/actions/go-install@adb01429f88e459fcc045598317b5d6c09f95647 # v1.26.1
        with:
          package: golang.org/x/vuln/cmd/govulncheck@v1.7.0

      - name: Run govulncheck
        run: govulncheck -show verbose ./...

  # ── CodeQL Analysis ───────────────────────────────────
  codeql:
    name: CodeQL Analysis (Go)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      security-events: write
    steps:
      # hardening-exception: egress-audit — this job downloads the CodeQL bundle and
      #   its query packs, downloads Go modules and tools from the module proxy, and
      #   clones this repository; harden-runner has never run in this repository, so
      #   no endpoint baseline exists and a block policy written without one fails
      #   closed on its first run; audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: go

      - name: Build for CodeQL
        run: go build ./...

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: /language:go

  # ── Stale Dependabot PRs ──────────────────────────────
  stale-dependabot:
    name: Flag stale Dependabot PRs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write
    steps:
      # hardening-exception: egress-audit — this job calls the GitHub API;
      #   harden-runner has never run in this repository, so no endpoint baseline
      #   exists and a block policy written without one fails closed on its first run;
      #   audit is what produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Label PRs open > 14 days
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr list \
            --repo "$GITHUB_REPOSITORY" \
            --author "app/dependabot" \
            --state open \
            --json number,createdAt,title \
            --jq '.[] | select((.createdAt | fromdateiso8601) < (now - 1209600)) | .number' \
          | xargs -r -I{} gh pr edit {} \
              --repo "$GITHUB_REPOSITORY" \
              --add-label "stale-security-patch" || true

  # ── Notify on failure ─────────────────────────────────
  notify-on-failure:
    name: Create issue on failure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [ci, osv-scan, govulncheck, codeql, stale-dependabot]
    if: failure() && github.event_name == 'schedule'
    permissions:
      issues: write
    steps:
      # hardening-exception: egress-audit — this job downloads the Go vulnerability
      #   database and the govulncheck tool and calls the GitHub API; harden-runner
      #   has never run in this repository, so no endpoint baseline exists and a block
      #   policy written without one fails closed on its first run; audit is what
      #   produces that list
      - name: Harden the runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit
      - name: Create failure issue
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const title = `Scheduled build failed — ${new Date().toISOString().slice(0,10)}`;
            const body = [
              '## Scheduled Build Failure',
              '',
              `**Workflow run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              '',
              'The weekly security scan failed. Please investigate and fix before the next release.',
              '',
              'Common causes:',
              '- A transitive Go dependency published a breaking change',
              '- An OSV vulnerability was found in go.sum',
              '- CodeQL detected a new code quality issue',
              '- A stale Dependabot PR requires manual review',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
              labels: ['bug', 'ci'],
            });
