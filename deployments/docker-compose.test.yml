# Test stack for acceptance tests.
#
# No backend image is pinned here on purpose: TFR_ACC_BACKEND_IMAGE names
# whatever backend build you want the acceptance suite to run against, so
# this stack works the same way against a local build, a release tag, or a
# private registry image — see "Running tests" in README.md.
#
# Start: TFR_ACC_BACKEND_IMAGE=<image> docker compose -f deployments/docker-compose.test.yml up -d
# Stop:  docker compose -f deployments/docker-compose.test.yml down --volumes

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: terraform_registry
      POSTGRES_USER: registry
      POSTGRES_PASSWORD: registry
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U registry -d terraform_registry"]
      interval: 2s
      timeout: 5s
      retries: 15

  backend:
    image: ${TFR_ACC_BACKEND_IMAGE:?set TFR_ACC_BACKEND_IMAGE to the backend image to test against; see README.md}
    environment:
      - TFR_DATABASE_HOST=postgres
      - TFR_DATABASE_PORT=5432
      - TFR_DATABASE_NAME=terraform_registry
      - TFR_DATABASE_USER=registry
      - TFR_DATABASE_PASSWORD=registry
      - TFR_DATABASE_SSL_MODE=disable
      - ENCRYPTION_KEY=test-encryption-key-must-be-32ch
      - TFR_JWT_SECRET=test-jwt-secret-that-is-32-chars!!
      - DEV_MODE=true
      # This stack runs at the default logging.level ("info"), which the
      # backend's boot guard can no longer treat as an unambiguous dev/test
      # signal on its own — confirm explicitly instead of setting
      # logging.level=debug just to satisfy it.
      - TFR_CONFIRM_NON_PRODUCTION=true
      - TFR_SERVER_HOST=0.0.0.0
      - TFR_SERVER_PORT=8080
      # Written once at boot with the backend's one-time setup-wizard token.
      # The acceptance suite reads it from the bind mount below to bootstrap
      # a platform-admin account through the setup API — see README.md and
      # internal/provider/provider_test.go. No SQL is run against this
      # database from outside the backend itself.
      - SETUP_TOKEN_FILE=/run/registry-acc/setup-token
    ports:
      - "8081:8080"
    volumes:
      - ./.acc-run:/run/registry-acc
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data-test:
    driver: local
